name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flockoff
          POSTGRES_PASSWORD: flockoff
          POSTGRES_DB: flockoff_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U flockoff"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # CI-only values. Nothing here is a real secret: the database is a throwaway service
    # container and AUTH_SECRET only signs tokens inside this job.
    env:
      CI: "true"
      TEST_DATABASE_URL: postgresql://flockoff:flockoff@localhost:5434/flockoff_test?schema=public
      DATABASE_URL: postgresql://flockoff:flockoff@localhost:5434/flockoff_test?schema=public
      DIRECT_URL: postgresql://flockoff:flockoff@localhost:5434/flockoff_test?schema=public
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      AUTH_TRUST_HOST: "true"
      STORAGE_DRIVER: local
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Integration tests apply migrations to the test database themselves (migrate deploy).
      - name: Unit and integration tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
