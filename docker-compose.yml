services:
  db:
    image: postgres:16
    container_name: flockoff-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flockoff
      POSTGRES_PASSWORD: flockoff
      POSTGRES_DB: flockoff
    ports:
      - "5434:5432"
    volumes:
      - flockoff-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flockoff -d flockoff"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flockoff-pgdata:
